<!-- CineReserve Movie Details Modal -->
<div class="modal fade" id="movieDetailsModal" tabindex="-1"
     aria-labelledby="movieDetailsTitle" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content cr-details-modal">
            <div class="modal-header">
                <div>
                    <p class="text-uppercase small mb-1">CineReserve</p>
                    <h2 class="modal-title fs-3" id="movieDetailsTitle">Movie Details</h2>
                </div>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="movieDetailsBody">
                <p class="text-secondary">Select a movie to view its details.</p>
            </div>
        </div>
    </div>
</div>
